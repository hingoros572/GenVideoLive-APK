name: Build Gen Video Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/share-repost-inbox
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Gen-Video-Live-Standalone-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
