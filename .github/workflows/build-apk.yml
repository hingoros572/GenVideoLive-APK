name: Build Gen Video Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/share-repost-inbox
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Enforce Expo Video Media3 LoadControl compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("node_modules/expo-video/android/src/main/java/expo/modules/video/player/DefaultLoadControl.java")
          source = path.read_text()
          signature = "  public Allocator getAllocator(PlayerId playerId) {"
          if signature not in source:
              needle = "  @Override\\n  public Allocator getAllocator() {\\n    return allocator;\\n  }"
              if source.count(needle) != 1:
                  raise SystemExit("Could not find the exact Expo Video allocator method; stopping safely.")
              replacement = needle + "\\n\\n  @Override\\n  public Allocator getAllocator(PlayerId playerId) {\\n    return allocator;\\n  }"
              source = source.replace(needle, replacement)
              path.write_text(source)
          if source.count(signature) != 1:
              raise SystemExit("Media3 PlayerId allocator method is missing or duplicated.")
          print("Verified: Expo Video DefaultLoadControl implements getAllocator(PlayerId).")
          PY

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Diagnose Media3 dependency versions
        working-directory: android
        run: |
          ./gradlew :app:dependencyInsight --dependency media3-exoplayer --configuration releaseRuntimeClasspath --no-daemon
          ./gradlew :app:dependencyInsight --dependency media3-common --configuration releaseRuntimeClasspath --no-daemon

      # IMPORTANT: assembleRelease bundles the JavaScript into the APK.
      # assembleDebug is a development build and expects Metro to be running.
      - name: Build standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Gen-Video-Live-Standalone-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
