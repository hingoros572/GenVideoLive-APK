name: Build Gen Video Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/share-repost-inbox
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Fix Media3 PlayerId LoadControl compatibility
        run: python3 scripts/fix-expo-video-loadcontrol.py

      - name: Switch Android editor preview to Skia
        run: python3 scripts/disable-android-native-graded-preview.py

      - name: Inspect Expo Video LoadControl source before patching
        run: |
          echo "=== Expo Video Android LoadControl source files ==="
          find node_modules/expo-video/android/src/main -type f 2>/dev/null | grep -Ei 'LoadControl|VideoPlayer' | sort || true
          echo "=== LoadControl declarations and allocator methods ==="
          grep -R -n -E 'class .*LoadControl|interface LoadControl|implements LoadControl|extends DefaultLoadControl|getAllocator' node_modules/expo-video/android/src/main 2>/dev/null || true
          echo "=== DefaultLoadControl source candidates ==="
          find node_modules/expo-video/android/src/main -type f -iname '*DefaultLoadControl*' -print -exec sed -n '1,260p' {} \; 2>/dev/null || true
      - name: Verify Expo Video Media3 LoadControl compatibility method
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("node_modules/expo-video/android/src/main/java/expo/modules/video/player/VideoPlayerLoadControl.kt")
          source = path.read_text()
          method = "  @androidx.annotation.Keep\n  override fun getAllocator(playerId: androidx.media3.exoplayer.analytics.PlayerId): androidx.media3.exoplayer.upstream.Allocator {\n    return super.getAllocator()\n  }"
          if source.count(method) != 1:
              raise SystemExit("Expected exactly one kept getAllocator(PlayerId) override in VideoPlayerLoadControl.kt.")
          print("Verified kept getAllocator(PlayerId) override in the actual Expo Video LoadControl subclass.")
          PY
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Record resolved Media3 runtime versions
        working-directory: android
        continue-on-error: true
        run: |
          ./gradlew :app:dependencyInsight --dependency media3-exoplayer --configuration releaseRuntimeClasspath --no-daemon
          ./gradlew :app:dependencyInsight --dependency media3-common --configuration releaseRuntimeClasspath --no-daemon
          ./gradlew :app:dependencyInsight --dependency media3-transformer --configuration releaseRuntimeClasspath --no-daemon

      # IMPORTANT: assembleRelease bundles the JavaScript into the APK.
      # assembleDebug is a development build and expects Metro to be running.
      - name: Build standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Inspect packaged Media3 LoadControl implementations
        continue-on-error: true
        run: |
          set -e
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          set +e
          /tmp/jadx/bin/jadx --no-res --show-bad-code -d /tmp/jadx-out android/app/build/outputs/apk/release/app-release.apk
          JADX_EXIT=$?
          set -e
          echo "JADX exit code: $JADX_EXIT (partial source output will still be inspected)"
          echo "=== LoadControl declarations and allocator overrides in the packaged APK ==="
          if [ -d /tmp/jadx-out/sources ]; then
            grep -R -n -E 'implements LoadControl|: LoadControl|extends DefaultLoadControl|getAllocator' /tmp/jadx-out/sources | head -240 || true
          else
            echo "JADX did not create a sources directory."
          fi
          echo "=== Candidate Media3 LoadControl source files ==="
          find /tmp/jadx-out/sources -type f 2>/dev/null | grep -Ei 'LoadControl|ExoPlayer' | head -100 || true

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Gen-Video-Live-Standalone-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
