name: Build Gen Video Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/share-repost-inbox
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Keep Expo Video Media3 LoadControl compatibility method
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("node_modules/expo-video/android/src/main/java/expo/modules/video/player/DefaultLoadControl.java")
          source = path.read_text()
          method = "  @Override\n  public Allocator getAllocator(PlayerId playerId) {\n    return allocator;\n  }"
          if source.count(method) != 1:
              raise SystemExit("Expected exactly one PlayerId allocator override in Expo Video source.")
          keep = "  @androidx.annotation.Keep\n" + method
          if keep not in source:
              source = source.replace(method, keep)
              path.write_text(source)
          if source.count(keep) != 1:
              raise SystemExit("Could not preserve the PlayerId allocator override.")
          print("Verified and kept getAllocator(PlayerId) against R8 shrinking.")
          PY

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      # IMPORTANT: assembleRelease bundles the JavaScript into the APK.
      # assembleDebug is a development build and expects Metro to be running.
      - name: Build standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Gen-Video-Live-Standalone-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
